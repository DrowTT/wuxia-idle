server {
  listen 80;
  listen [::]:80;
  server_name wuxia.drowts.cn;

  root /www/wwwroot/wuxia-idle/acme;

  location ^~ /.well-known/acme-challenge/ {
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name wuxia.drowts.cn;

  root /www/wwwroot/wuxia-idle/current;
  index index.html;

  ssl_certificate /etc/nginx/ssl/wuxia-idle/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/wuxia-idle/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  access_log /var/log/nginx/wuxia-idle.access.log;
  error_log /var/log/nginx/wuxia-idle.error.log warn;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
